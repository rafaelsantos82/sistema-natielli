# DEV ONLY — macOS/local. Production: deploy/docker-compose.prod.yml (droplet Ubuntu).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Volume uploads_dev; ./data/uploads no .env vira /srv/data (read-only) no container
      UPLOAD_BASE_PATH: /data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - uploads_dev:/data/uploads
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - private

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - private

  migrate:
    image: migrate/migrate
    profiles: ["ops"]
    volumes:
      - ./migrations:/migrations
    command: ["-path=/migrations", "-database=${DATABASE_URL}", "up"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private

volumes:
  postgres_data:
  uploads_dev:

networks:
  private:
